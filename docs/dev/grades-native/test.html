<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HubGrades 테스트</title>
<meta name="robots" content="noindex">
<script>
/* 테마: ?theme=light|dark, 없으면 기기 설정 — 허브처럼 <html data-theme> 만 정함 */
(function () {
  var t = new URLSearchParams(location.search).get('theme');
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/ds.css">
<link rel="stylesheet" href="gr.css">
<style>
/* 허브 틀 흉내: 바탕색만 가진 빈 페이지. ?clash 로 열면 일부러 전역 규칙을 심어 .gr 가 흔들리는지 확인 */
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:sans-serif}
.tbar{padding:10px 16px;font:600 13px sans-serif;background:#ff6a3d;color:#fff}
.tbar a{color:#fff;margin-left:10px}
/* 보통 세기(!important 없음)의 전역 규칙 — 허브가 흔히 쓸 법한 것 */
body.clash button{background:red;border-radius:0}
.clash .card{padding:0;background:yellow}
body.clash h2{font-size:40px}
body.clash *{font-family:serif}
</style>
</head>
<body>
<div class="tbar">HubGrades 테스트 · <a href="?demo">?demo (가상 KM482919)</a> <a href="?demo&code=BD774119">?demo 실전반 (가상 BD774119)</a> <a href="?demo&theme=dark">다크</a> <a href="?code=KM482919">서울 서버 + KM482919</a> <a href="?demo&clash">충돌 테스트</a> <a href="?demo&unmount">mount→unmount→mount</a></div>
<div id="root"></div>
<script>
var Q = new URLSearchParams(location.search), DEMO = Q.has('demo');
if (Q.has('clash')) document.body.classList.add('clash');
['../../assets/config.js'].concat(DEMO ? ['../assets/core.js', '../assets/logic.js', '../assets/mock.js'] : []).forEach(function (s) { document.write('<script src="' + s + '"><\/script>'); });
/* 몽글이: 허브처럼 mongle.js 가 있으면 불러오고, 미리보기에서는 HubSession.char() 를 흉내 냄 (mongle.js 가 없으면 제목 옆이 비어 있음) */
document.write('<script src="../assets/mongle.js"><\/script>');
if (DEMO && !window.HubSession) window.HubSession = { char: function () { return Promise.resolve({ ok: true, data: { state: { body: 'lavender', hat: 'none', glasses: 'none', charm: 'none' }, show: true } }); } };
</script>
<script src="gr.js"></script>
<script>
var cfg = (window.SEISEKI_CONFIG || {}).API_URL || {};
function go() {
  HubGrades.mount(document.getElementById('root'), {
    code: Q.get('code') || 'KM482919', name: Q.get('name') || '',
    apiUrl: DEMO ? '' : (Q.get('api') || cfg.dev), env: 'dev', demo: DEMO,
    onAuthError: function (m) { console.warn('auth error:', m); }
  });
}
go();
if (Q.has('unmount')) setTimeout(function () { HubGrades.unmount(); document.getElementById('root').innerHTML = '<p style="padding:20px">unmount 됨 — 1초 뒤 다시 mount</p>'; setTimeout(go, 1000); }, 1500);
/* 렌더 확인용: ?click=선택자1;;선택자2 … 를 차례로 누름 (처음 1.5초 뒤, 그다음 0.6초 간격) */
if (Q.get('click')) (function () {
  var list = Q.get('click').split(';;'), i = 0;
  (function next() { setTimeout(function () { var e = document.querySelector(list[i]); if (e) e.click(); if (++i < list.length) next(); }, i ? 600 : 1500); })();
})();
</script>
</body>
</html>
