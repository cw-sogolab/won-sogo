/* 화면 테마: 설정의 자동·라이트·다크(이 기기 localStorage) → <html data-theme>. 자동이면 기기 설정을 따라감. 바뀌면 window 'hub:theme' (detail={theme,pref}) */
(function () {
  var KEY = /\/dev\//.test(location.pathname) ? 'hub-dev.theme' : 'hub.theme', root = document.documentElement, mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function getPref() { var p = null; try { p = localStorage.getItem(KEY); } catch (e) {} return p === 'light' || p === 'dark' ? p : 'auto'; }
  function apply(pref, fire) {
    var t = pref === 'light' || pref === 'dark' ? pref : (mq && mq.matches ? 'dark' : 'light'), was = root.getAttribute('data-theme');
    root.setAttribute('data-theme', t); root.setAttribute('data-theme-pref', pref);
    if (fire === 'always' || (fire && was !== t)) { try { window.dispatchEvent(new CustomEvent('hub:theme', { detail: { theme: t, pref: pref } })); } catch (e) {} }
  }
  window.HubTheme = {
    get: getPref,
    current: function () { return root.getAttribute('data-theme') || 'light'; },
    set: function (pref) { pref = pref === 'light' || pref === 'dark' ? pref : 'auto'; try { if (pref === 'auto') localStorage.removeItem(KEY); else localStorage.setItem(KEY, pref); } catch (e) {} apply(pref, 'always'); }
  };
  apply(getPref(), false);
  if (mq) { var on = function () { if (getPref() === 'auto') apply('auto', true); }; if (mq.addEventListener) mq.addEventListener('change', on); else if (mq.addListener) mq.addListener(on); }
})();
</script>
<!-- 옛 토큰(app.css — 아직 그 이름을 쓰는 모듈용)을 먼저 두고 바로 위에 디자인 토큰 ds.css 를 얹음(같은 이름은 ds 가 이김).

<style>
/* 옛 토큰 → ds 토큰 (모듈이 ds 로 다 옮기면 지워도 됨) */
:root[data-theme]{
  --surface:var(--card); --fill:var(--pt-l); --fill-hover:var(--hover); --ink2:var(--body); --muted:var(--sub); --faint:var(--tabtx);
  --blue:var(--pt); --blue-press:var(--pt-d); --blue-soft:var(--pt-l); --blue-ink:var(--pt-d); --me:var(--pt);
  --red:var(--warn); --red-soft:var(--no-b); --green:var(--ok); --green-soft:var(--ok-l); --orange:var(--ing-t); --orange-soft:var(--ing-b);
  --shadow:var(--sh-s); --btn:var(--pt); --btn-shadow:var(--sh-s); --f-body:var(--f); --f-round:var(--fn);
}
/* ── 허브 틀 (시안 sian-final: 흰 카드 · 포인트 블루 · 아래 탭바) ── */
html,body{height:100%}
body.hub{margin:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:600;word-break:keep-all;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.hub button{font-family:inherit}
.hub .devbar{flex:none}
.hub-top{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top));background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);box-shadow:0 1px 0 var(--line);z-index:5}
.hub-top[hidden]{display:none!important}
.hub-brand{display:flex;align-items:center;gap:9px;font-family:var(--fn);font-weight:800;font-size:17px;color:var(--ink);text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.hub-brand img{width:32px;height:32px;display:block}
.hub-brand .dk{display:none}
:root[data-theme="dark"] .hub-brand .lt{display:none}
:root[data-theme="dark"] .hub-brand .dk{display:block}
.hub-who{font-size:13px;color:var(--sub);white-space:nowrap;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
.hub-tabs{margin-left:auto;display:flex;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh-s)}
.hub-tab{position:relative;display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--tabtx);font:700 14px var(--f);padding:6px 14px 6px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:transform .16s var(--spring),background .2s,color .2s}
.hub-tab svg{width:24px;height:24px;flex:none;display:block;overflow:visible}
.hub-tab:active{transform:scale(.95)}
.hub-tabs .hub-tab[aria-selected="true"]{background:var(--pt-l);color:var(--pt-d);font-weight:800}
.hub-tab .bd{position:absolute;right:2px;top:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font:800 11px/18px var(--fn);text-align:center}
.hub-me{width:40px;height:40px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh-s);display:grid;place-items:center;cursor:pointer;padding:0;line-height:0;flex:none}
.hub-me[hidden],.hub-out[hidden]{display:none}
.hub-out{border:0;background:var(--card);box-shadow:var(--sh-s);color:var(--sub);font:700 13px var(--f);height:36px;padding:0 14px;border-radius:13px;cursor:pointer;flex:none}
.hub-out:active{transform:translateY(1px)}
.hub-body{flex:1;min-height:0;position:relative}
.hub-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.hub-frame[hidden]{display:none}
.hub-pane{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.hub-pane[hidden]{display:none}
.hub-soon{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);text-align:center;padding:24px}
.hub-soon b{font-size:20px;font-weight:800;color:var(--ink)}
/* 아래 탭바 (휴대폰) — 시안 .tabbar */
.hub-bar{flex:none;display:none;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px -14px rgba(76,62,160,.28);padding:8px 8px env(safe-area-inset-bottom);z-index:5;position:relative}
.hub-bar .hub-tab{flex:1;height:60px;flex-direction:column;justify-content:center;gap:3px;padding:0 2px;border-radius:16px;font-size:11px;font-weight:700;color:var(--tabtx)}
.hub-bar .hub-tab svg{width:26px;height:26px}
.hub-bar .hub-tab[aria-selected="true"]{color:var(--pt);font-weight:800}
.hub-bar .hub-tab[aria-selected="true"] svg{filter:drop-shadow(0 3px 3px rgba(91,91,255,.3))}
.hub-bar .hub-tab .bd{right:calc(50% - 26px);top:2px}
.hub-bar:empty{display:none!important}
@media (max-width:760px){
  .hub-tabs{display:none}.hub-bar{display:flex}.hub-who{display:none}
  body.hub.hub-stu .hub-top{display:none}             /* 학생 휴대폰: 각 화면이 자기 머리띠를 가짐(홈 톱니 → 설정) */
  .hub-top{padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top))}.hub-out{margin-left:auto}
}
/* 로그인 */
.hub-login{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;box-sizing:border-box}
.hub-login[hidden]{display:none}
.hub-hero{position:relative;width:min(400px,100%);height:210px;border-radius:28px;background:var(--hero);box-shadow:var(--sh);overflow:hidden;flex:none}
.hub-hero .ped{position:absolute;left:50%;bottom:16px;width:176px;height:36px;transform:translateX(-50%);border-radius:50%;background:var(--ped);box-shadow:0 7px 0 var(--ped-s),0 22px 22px -8px rgba(76,62,160,.4)}
.hub-hero .ch{position:absolute;left:50%;bottom:22px;width:150px;margin-left:-75px;line-height:0}
.hub-hero .ch svg{display:block;width:100%;height:auto;overflow:visible}
.hub-hero .say{position:absolute;left:14px;top:14px;height:28px;padding:0 12px;border-radius:14px 14px 14px 4px;background:var(--card);font-size:12.5px;font-weight:800;display:flex;align-items:center;box-shadow:var(--sh-s);z-index:1}
.hub-card{width:min(400px,100%);box-sizing:border-box;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:22px 20px 18px;margin-top:14px}
.hub-card h1{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.hub-card p{margin:0 0 16px;color:var(--sub);font-size:14px;line-height:1.55}
.hub-card p b{color:var(--ink)}
.hub-field{width:100%;box-sizing:border-box;border:0;background:var(--soft);box-shadow:inset 0 0 0 2px var(--line);border-radius:18px;padding:15px 16px;font:800 22px var(--fn);letter-spacing:.12em;text-align:center;color:var(--ink);text-transform:uppercase;transition:box-shadow .2s,background .2s}
.hub-field.pw{text-transform:none;letter-spacing:.04em;font-size:18px}
.hub-field::placeholder{color:var(--tabtx);opacity:.7}
.hub-field:focus{outline:0;box-shadow:inset 0 0 0 2.5px var(--pt);background:var(--card)}
.hub-go{display:block;width:100%;height:54px;margin-top:12px;border:0;border-radius:18px;background:var(--pt);color:#fff;font:800 17px var(--f);cursor:pointer;
  box-shadow:0 12px 20px -10px var(--pt),inset 0 -4px 0 rgba(30,20,160,.28),inset 0 2px 0 rgba(255,255,255,.3);transition:transform .16s var(--spring),box-shadow .16s}
.hub-go:active{transform:translateY(3px);box-shadow:0 4px 8px -6px var(--pt),inset 0 -1px 0 rgba(30,20,160,.28)}
.hub-go:disabled{opacity:.55;cursor:default}
.hub-rem{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--sub);font-size:14px}
.hub-rem input{width:18px;height:18px;accent-color:var(--pt)}
.hub-err{min-height:20px;margin-top:10px;color:var(--warn);font-size:14px;font-weight:700;text-align:center}
.hub-foot{margin-top:18px;color:var(--tabtx);font-size:12px}
@media (prefers-reduced-motion:reduce){.hub-tab,.hub-go{transition:none}}
</style>
</head>

<script>
(function () {

  var V = '20261126c';
  var API = (window.SEISEKI_CONFIG && window.SEISEKI_CONFIG.API_URL && window.SEISEKI_CONFIG.API_URL.dev) || '';
  var ENV = /\/dev\//.test(location.pathname) ? 'dev' : 'prod';
  var KEY = 'hub-dev.sid';

  var sid = '', myName = '', cur = null, loaded = {};

  var SUB = {
    closet: { pane: 'p-closet', parent: 'home', label: '꾸미기', mount: function (el) { return loadOnce('closet/closet.js?v=' + V).then(function () { HubCloset.mount(el, { session: HubSession, back: function () { show('home'); } }); }); } },
    settings: { pane: 'p-settings', parent: 'home', label: '설정', mount: function (el) { return loadOnce('settings/settings.js?v=' + V).then(function () { HubSettings.mount(el, { session: HubSession, theme: window.HubTheme, back: function () { show('home'); }, open: openSub, leave: leave }); }); } }
  };
  var TABS = teacher ? TEACHER : STUDENT;
  if (!teacher) document.body.classList.add('hub-stu');

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  // 안쪽 화면이 지난 사람의 번호를 기억하고 있으면 새 번호가 안 먹으니 먼저 지움
  function wipeInner() { var k = ENV === 'dev' ? ['seiseki-dev.code', 'seiseki-dev.view', 'kitaku-dev.me'] : ['seiseki.code', 'seiseki.view', 'kitaku.me']; k.forEach(function (x) { store(x, null); }); }
  function loadScript(src) { return new Promise(function (res, rej) { var e = document.createElement('script'); e.src = src; e.onload = res; e.onerror = rej; document.head.appendChild(e); }); }
  var once = {};
  function loadOnce(src) { return once[src] || (once[src] = loadScript(src).catch(function (e) { delete once[src]; throw e; })); }
  function soon(el, what) {
    var m = window.HubMongle ? HubMongle.svg(null, 96, { expr: 'base' }) : '';
    el.innerHTML = '<div class="hub-soon">' + m + '<b>' + what + ' 준비 중이에요</b><span>곧 열려요. 조금만 기다려 주세요.</span></div>';
  }

  /* ── 탭별 화면 붙이기 (처음 열 때 한 번) ── */
  function mountHome(el) { return loadOnce('home/home.js?v=' + V).then(function () { HubHome.mount(el, { session: HubSession, name: myName, go: show, open: openSub }); }); }
  function mountGrades(el) { return loadScript('grades-native/gr.js?v=' + V).then(function () { HubGrades.mount(el, { code: sid, name: myName, apiUrl: API, env: ENV, onAuthError: function () { leave(); } }); }); }
  function mountQuiz() {
    window.HUB = 1; window.HUB_ENV = ENV;
    if (!teacher) { try { localStorage.setItem((ENV === 'dev' ? 'kitaku-dev.' : 'kitaku.') + 'me', JSON.stringify({ id: sid, nm: myName })); } catch (e) {} }
    return loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(function () {})
      .then(function () { return loadScript('qz/data.js?v=' + V); }).then(function () { return loadScript('qz/quiz.js?v=' + V); });
  }
  function mountCurriculum(el) { return loadScript('curriculum/cur.js?v=' + V).then(function () { HubCurriculum.mount(el, { session: HubSession }); }, function () { soon(el, '수업'); }); }
  function mountQna(el) { return loadScript('qna/qna.js?v=' + V).then(function () { HubQna.mount(el, { session: HubSession }); }, function () { soon(el, '질문'); }); }
  function relogin() { HubSession.clear(); $('#h-top').hidden = true; PANES.forEach(function (p) { $('#' + p).hidden = true; }); loaded = {}; $('#h-gate').hidden = false; $('#h-pwerr').textContent = '로그인이 풀렸어요. 다시 입력해 주세요.'; $('#h-pw').value = ''; $('#h-pw').focus(); }
  function mountGradesAdmin(el) {
    return loadScript('grades-admin/ga.js?v=' + V).then(function () {
      HubGradesAdmin.mount(el, { session: HubSession, apiUrl: API, env: ENV, onAuthError: relogin });
    }, function () {   // 새 강사 화면이 아직 없으면 옛 화면을 그대로 끼워 씀
      var f = $('#f-a'); el.hidden = true; f.hidden = false; f.src = 'grades.html?embed=1#teacher';
    });
  }
  function mountQnaAdmin(el) {
    return loadScript('qna/qna.js?v=' + V).then(function () { HubQnaAdmin.mount(el, { session: HubSession, onPending: function (n) { badge('qna', n); }, onAuthError: relogin }); }, function () { soon(el, '질문 관리'); });
  }
  function badge(id, n) { document.querySelectorAll('.hub-tab[data-id="' + id + '"] .bd').forEach(function (b) { b.remove(); }); if (n > 0) document.querySelectorAll('.hub-tab[data-id="' + id + '"]').forEach(function (t) { var b = document.createElement('span'); b.className = 'bd'; b.textContent = n > 99 ? '99+' : n; t.appendChild(b); }); }

  function tabsHtml() {
    ['h-tabs', 'h-bar'].forEach(function (nid) {
      var t = $('#' + nid); t.innerHTML = '';
      TABS.forEach(function (x) {
        var b = document.createElement('button'); b.className = 'hub-tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = x.id; b.dataset.icon = x.icon; b.setAttribute('aria-selected', 'false');
        b.innerHTML = HubIcons.tab(x.icon, false) + '<span>' + x.label + '</span>'; b.onclick = function () { show(x.id); }; t.appendChild(b);
      });
    });
  }
  function markTabs(id) {
    document.querySelectorAll('.hub-tab[data-id]').forEach(function (b) {
      var on = b.dataset.id === id, was = b.getAttribute('aria-selected') === 'true';
      b.setAttribute('aria-selected', String(on)); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      if (on !== was) { var s = b.querySelector('svg'); if (s) s.outerHTML = HubIcons.tab(b.dataset.icon, on); }
    });
  }
  function show(id) {
    var sub = !teacher && SUB[id], tab = sub ? null : (TABS.filter(function (x) { return x.id === id; })[0] || TABS[0]);
    var pane = sub ? sub.pane : tab.pane; id = sub ? id : tab.id; cur = id;
    markTabs(sub ? sub.parent : id);
    PANES.forEach(function (p) { $('#' + p).hidden = p !== pane; });
    if (sub) { Promise.resolve().then(function () { return sub.mount($('#' + pane)); }).catch(function () { soon($('#' + pane), sub.label); }); }
    else if (!loaded[id]) { loaded[id] = Promise.resolve().then(function () { return tab.mount($('#' + tab.pane)); }).catch(function () { soon($('#' + tab.pane), tab.label); }); }
    else if (id === 'home' && window.HubHome && HubHome.refresh) HubHome.refresh();
    try { history.replaceState(null, '', location.pathname + location.search + (teacher ? '#teacher' : (id === 'home' ? '' : '#' + id))); } catch (e) {}
    return loaded[id] || Promise.resolve();
  }
  /** 홈에서 들어가는 화면: closet · settings · rank(퇴근 미션 탭의 랭킹) */
  function openSub(what) {
    if (what === 'rank') {
      return show('quiz').then(function () {
        try {
          if (window.HubQuiz && typeof HubQuiz.openRank === 'function') HubQuiz.openRank('cls');
          else if (typeof window.openRank === 'function') window.openRank('cls');   // 퀴즈(qz/quiz.js)의 랭킹 화면 — 「돌아가기」는 퀴즈 첫 화면
        } catch (e) {}
      });
    }
    if (SUB[what]) show(what);
  }
  function initialOf(nm) { return window.HubHome && HubHome._initial ? HubHome._initial(nm) : String(nm || '?').charAt(0); }
  function meBtn() {
    var b = $('#h-me'); if (teacher || !sid) return;
    HubSession.char().then(function (r) {
      var c = r.data || {};
      b.innerHTML = window.HubMongle ? HubMongle.avatar(c.state, 34, { show: c.show !== false, initial: initialOf(myName) }) : '';
    });
  }
  window.addEventListener('hub:char', meBtn);
  function enter(s, nm) {
    sid = s; myName = nm || ''; loaded = {};
    HubSession.init({ code: s, name: nm, env: ENV, apiUrl: API });
    $('#h-login').hidden = true; $('#h-top').hidden = false; $('#h-who').textContent = nm ? nm + ' 학생' : '';
    $('#h-me').hidden = false; $('#h-me').onclick = function () { show('settings'); };
    tabsHtml(); var h = (location.hash || '').slice(1);
    show(STUDENT.some(function (x) { return x.id === h; }) || SUB[h] ? h : 'home');
    loadOnce('home/home.js?v=' + V).then(meBtn, meBtn);
  }
  function leave() {
    store(KEY, null); wipeInner(); HubSession.clear(); sid = ''; loaded = {};
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    location.reload();   // 퀴즈·성적이 페이지 안에서 돌고 있으니 새로 불러와 지난 사람의 상태를 모두 비움
  }

  var fails = 0, lockUntil = 0;
  function login(raw, remember, quiet) {
    var code = Core.normCode(raw), err = $('#h-err');
    if (Date.now() < lockUntil) { err.textContent = '잠시 후 다시 시도해 주세요.'; return; }
    var p = Core.codeProblem ? Core.codeProblem(code) : (Core.isValidCode(code) ? '' : 'format');
    if (p) { err.textContent = p === 'short' ? '영문 2자 + 숫자 6자리를 모두 넣어 주세요.' : '번호를 다시 확인해 주세요.'; if (p === 'check' && ++fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; } return; }
    if (!API) { err.textContent = '서버 주소가 없어요. config.js 를 확인해 주세요.'; return; }
    $('#h-go').disabled = true; err.textContent = '';
    fetch(API + '?mode=who&id=' + encodeURIComponent(code)).then(function (r) { return r.json(); }).then(function (d) {
      $('#h-go').disabled = false;
      if (d && d.ok && d.member) { fails = 0; wipeInner(); if (remember) store(KEY, code); enter(code, d.nm); }
      else if (d && d.error === 'busy') err.textContent = '잠시 후 다시 시도해 주세요.';
      else { if (!quiet) err.textContent = '등록되지 않은 번호예요. 선생님께 확인해 주세요.'; if (++fails >= 5) { lockUntil = Date.now() + 60000; fails = 0; } store(KEY, null); }
    }).catch(function () { $('#h-go').disabled = false; if (!quiet) err.textContent = '인터넷 연결을 확인하고 다시 눌러 주세요.'; });
  }

  $('#h-sid').addEventListener('input', function () { var v = Core.normCode(this.value); this.value = Core.fmtCode ? Core.fmtCode(v) : v; $('#h-err').textContent = ''; });
  $('#h-sid').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#h-go').click(); });
  $('#h-go').onclick = function () { login($('#h-sid').value, $('#h-rem').checked); };
  $('#h-out').onclick = leave;
  $('#h-brand').onclick = function (e) { e.preventDefault(); if (!$('#h-top').hidden) show(TABS[0].id); };

  // 같은 페이지에서 주소만 #teacher ↔ 학생으로 바뀌면(주소창에 직접 입력) 새로 불러옴 — 퀴즈가 #teacher 를 받아 학생 화면 안에 PIN 화면을 띄우지 않게
  window.addEventListener('hashchange', function () { if (/^#(teacher|admin)$/.test(location.hash) !== teacher || /[#&]sid=/.test(location.hash)) location.reload(); });

  // 시작: 강사(#teacher)는 비밀번호 화면 → 강사 탭 / 학생은 #sid= 로 넘어왔거나 기억한 번호가 있으면 바로
  if (teacher) {
    HubSession.init({ code: '', name: '', env: ENV, apiUrl: API });
    $('#h-login').hidden = true; $('#h-gate').hidden = false; $('#h-who').textContent = '선생님';
    var gate = function () {
      var pw = $('#h-pw').value; if (!pw) return; $('#h-pwgo').disabled = true; $('#h-pwerr').textContent = '';
      HubSession.adminLogin(pw).then(function (r) {
        $('#h-pwgo').disabled = false;
        if (!r.ok) { $('#h-pwerr').textContent = r.error || '로그인하지 못했어요.'; return; }
        $('#h-pw').value = ''; $('#h-gate').hidden = true; $('#h-top').hidden = false; $('#h-who').textContent = '선생님'; $('#h-out').hidden = false; loaded = {};
        tabsHtml(); show('grades');
      });
    };
    $('#h-pwgo').onclick = gate; $('#h-pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') gate(); });
    setTimeout(function () { $('#h-pw').focus(); }, 50);
  }
  else {
    var hm = /[#&]sid=([A-Za-z0-9 -]{6,12})/.exec(location.hash), saved = store(KEY);
    if (hm) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} login(hm[1], false); }
    else if (saved) { $('#h-rem').checked = true; login(saved, true, true); }
    else $('#h-sid').focus();
  }
})();
</script>
</body>
</html>
