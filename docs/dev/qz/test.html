<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>[개발판] 퇴근 미션 화면 시험</title>
<!-- 허브 없이 퇴근 미션 학생 화면만 확인하는 시험 페이지. 서버로는 아무것도 보내지 않음(fetch 가짜), 학생은 가상 인물.
     ?view=entry|practice|quiz|wrong|lap|ticket|result|rank|mine  ?theme=light|dark  ?nochar=1(캐릭터 끈 학생)  ?nomongle=1(몽글이 없을 때 대체) -->
<script>
var P=new URLSearchParams(location.search);
document.documentElement.setAttribute('data-theme', P.get('theme')==='dark'?'dark':'light');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Anton&family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/ds.css">
<link rel="stylesheet" href="quiz.css">
<style>
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg);font-family:var(--f)}
.hub-body{flex:1;min-height:0;position:relative}
.hub-pane{position:absolute;inset:0}
</style></head>
<body>
<main class="hub-body"><section class="hub-pane qz" id="p-b">
  <div hidden><a id="logo"></a><a id="toGrades"></a><nav class="nav"><button id="nav-student"></button><button id="nav-teacher"></button></nav></div>
  <main id="app" aria-live="polite"></main>
</section></main>
<script src="../assets/mascots.js"></script>
<script>HubMascots.mount({ skip: ['m-note', 'm-quiz', 'm-star'] });</script>
<script>if(P.get('nomongle')) document.write('<scr'+'ipt>window.HubMongle=null<\/scr'+'ipt>'); else document.write('<scr'+'ipt src="../assets/mongle.js"><\/scr'+'ipt>');</script>
<script>
window.HUB=1; window.HUB_ENV="dev"; window.__QZ_TEST=1;
if(!window.HubMongle) try{ delete window.HubMongle; }catch(e){}
var d=new Date(), T=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
var V=P.get('view')||'entry';
try{
  Object.keys(localStorage).filter(function(k){return k.indexOf('kitaku-dev.')===0;}).forEach(function(k){localStorage.removeItem(k);});
  localStorage.setItem('kitaku-dev.me', JSON.stringify({id:"TS000000", nm:"김예시"}));
  if(V!=='practice' && V!=='result') localStorage.setItem('kitaku-dev.preset2', JSON.stringify({set:"jp-region", n:8, c:"화목반", date:T}));
  localStorage.setItem('kitaku-dev.prac', JSON.stringify({set:"jp-region", n:10}));
}catch(e){}
var CH={state:{body:'mint',hat:'cap',glasses:'round',charm:'star'}, show:!P.get('nochar')};
window.HubSession={ isAdmin:function(){return false;}, char:function(){ return Promise.resolve({ok:true,data:CH}); } };
var wk=new Date(d.getTime()-((d.getDay()||7)-1)*864e5), W=wk.getFullYear()+"-"+String(wk.getMonth()+1).padStart(2,"0")+"-"+String(wk.getDate()).padStart(2,"0");
function topRows(){ return [
  {name:"이샘플", acc:96.5, q:120, c:6, char:{body:'mint',hat:'beanie',glasses:'round',charm:'star'}},
  {name:"박테스트", acc:92, q:100, c:5, char:{body:'peach',hat:'headphone',glasses:'none',charm:'bolt'}},
  {name:"김예시", acc:90, q:80, c:4, char:CH.show?CH.state:null, ini:"김"},
  {name:"정연습", acc:88.5, q:60, c:3, char:null, ini:"정"},
  {name:"최더미", acc:85, q:40, c:2, char:{body:'butter',hat:'hood',glasses:'sun',charm:'chain'}} ]; }
var RANK={ok:true, at:new Date().toISOString(), weekStart:W, monthStart:T.slice(0,8)+"01", min:{prac:50,clsWeek:1,clsMonth:3}, lists:{}};
["전체","화목반","토일반","개념반","단풀반"].forEach(function(c){ ["week","month"].forEach(function(p){ RANK.lists["cls|"+c+"|"+p]={n:5,total:9,top:c==="개념반"?[]:topRows()}; }); });
["week","month"].forEach(function(p){ RANK.lists["prac|"+p]={n:5,total:9,top:topRows()}; RANK.lists["prac|"+p+"|qty"]={n:5,total:9,top:topRows().reverse()}; });
var F0=window.fetch.bind(window);
window.fetch=function(u,o){ u=String(u);
  if(/supabase|script\.google|docs\.google/.test(u)){ var body=/mode=rank/.test(u)? RANK : {ok:true};
    return Promise.resolve(new Response(JSON.stringify(body),{status:200,headers:{'content-type':'application/json'}})); }
  return F0(u,o); };
</script>
<script src="data.js"></script>
<script src="quiz.js"></script>
<script>
(function(){
  var q=window.__qz, $=function(s){return document.querySelector(s);};
  function right(){ var Q=q.S.q; if(Q.order){ Q.correctOrder.forEach(function(i){ q.choose(i); }); } else q.choose(Q.answer); }
  function wrong(){ var Q=q.S.q; if(Q.order){ Q.correctOrder.slice().reverse().forEach(function(i){ q.choose(i); }); } else q.choose((Q.answer+1)%Q.choices.length); }
  function start(){ var b=$('#start'); if(b) b.click(); }
  setTimeout(function(){
    if(V==='practice'||V==='result'){ q.go('practice'); }
    if(V==='quiz'){ start(); right(); q.advance(); right(); q.advance(); right(); }
    if(V==='quiz0'){ start(); right(); q.advance(); right(); q.advance(); }
    if(V==='wrong'){ start(); right(); q.advance(); wrong(); }
    if(V==='lap'){ start(); wrong(); var g3=0; while(g3++<200){ q.advance(); if(document.querySelector('.lapcard')) break; right(); } }
    if(V==='ticket'||V==='result'){ start(); var g=0; while(q.S && !q.S.done && g++<200){ right(); q.advance(); } }
    if(V==='rank'){ q.openRank(P.get('kind')||'cls','entry'); }
    if(V==='hubrank'){ window.HubQuiz.openRank(P.get('kind')); }
    if(V==='mine'){ start(); var g2=0; while(q.S && !q.S.done && g2++<200){ right(); q.advance(); } q.go('mine'); }
  }, 300);
})();
</script>
</body></html>
