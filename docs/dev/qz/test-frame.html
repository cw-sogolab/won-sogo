<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>[개발판] 퇴근 미션 휴대폰 폭 시험</title></head>
<!-- 헤드리스 크롬은 창 폭을 500px 아래로 못 줄여서, 같은 주소의 test.html 을 390px 틀(iframe)에 넣어 휴대폰 폭으로 봄. ?w=390&h=1600&q=view=ticket%26theme=dark -->
<body style="margin:0;background:#888">
<script>var p=new URLSearchParams(location.search);document.write('<iframe src="test.html?'+(p.get('q')||'')+'" style="border:0;display:block;width:'+(p.get('w')||390)+'px;height:'+(p.get('h')||1600)+'px"></iframe>');</script>
</body></html>
