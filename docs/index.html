<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>cw-sogolab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F5F3FF;--ink:#1E1B3A;--muted:#68638A;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14122B;--ink:#F3F1FF;--muted:#A8A1CE;--card:#1E1B3A}}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
.c{background:var(--card);border-radius:22px;padding:32px 28px;max-width:360px;box-shadow:0 2px 14px rgba(59,47,201,.08)}
h1{margin:0 0 8px;font-size:22px}p{margin:0;color:var(--muted);line-height:1.6}
</style>
</head>
<body><div class="c"><h1>준비 중이에요</h1><p>성적노트와 퇴근 미션을 한곳에 모은 새 사이트를 만들고 있어요. 지금은 선생님이 알려 준 주소를 써 주세요.</p></div></body>
</html>
